    '<div class="bars week7">' + days.map(function (d) {

      return '<div class="bcol' + (d.wd === tw ? ' today' : '') + cls + '"><small>' + fmt(d.t.kcal) + '</small><div class="btrack"><i style="height:' + Math.min(100, pct / 1.2) + '%"></i><em style="bottom:' + (100 / 1.2) + '%"></em></div><span>' + WD[d.wd] + '</span></div>';

  // dias
  h += '<div class="sechead"><h3>Dia a dia</h3><span class="muted small">Toque numa refeição para ver ou mudar</span></div><div class="wgrid">' + days.map(function (d) {

function lastDays(n, end) { var a = []; for (var i = n - 1; i >= 0; i--) a.push(addDays(end, -i)); return a; }
function scrProgresso() {
  var tk = todayKey(), days = lastDays(7, tk), meta = S.settings.kcal;
  var rows = days.map(function (k) { return {k:k, kcal:dayTotals(k, true).kcal, cups:cupsDone(k), md:mealsDone(k)}; });
  var rec = rows.filter(function (r) { return r.md; }), avg = rec.length ? rec.reduce(function (a, r) { return a + r.kcal; }, 0) / rec.length : 0;
  var h = '<div class="ptitle"><h1>Seu progresso</h1><p class="muted">Últimos 7 dias</p></div><div class="pgrid">';
  h += '<section class="card"><div class="row between"><div><div class="muted">Calorias por dia</div><div class="hnum dark"><b>' + fmt(avg) + '</b><span>média</span></div></div><div class="muted small right">Meta<br><b>' + fmt(meta) + '</b></div></div><div class="bars">' + rows.map(function (r) {
    var pct = r.kcal / meta * 100;
    return '<div class="bcol' + (r.k === tk ? ' today' : '') + '"><small>' + (r.kcal ? fmt(pct) + '%' : '–') + '</small><div class="btrack"><i style="height:' + Math.min(100, pct) + '%"></i></div><span>' + WD[kdate(r.k).getDay()] + '</span></div>';
  }).join('') + '</div><p class="muted small">Conta só as refeições marcadas como “Já comi”.</p></section>';
  // pizza de macros
  var t = dayTotals(tk, false), cal = [t.p * 4, t.c * 4, t.f * 9], tot = cal[0] + cal[1] + cal[2] || 1;
  h += '<section class="card"><div class="muted">De onde vêm as calorias do cardápio</div><div class="donutwrap">' + donut(cal.map(function (v) { return v / tot; }), [COL.p, COL.c, COL.f], '<b>' + fmt(t.kcal) + '</b><small>calorias</small>') +
    '<div class="legend">' + [['Proteínas', 0, 'p'], ['Carboidratos', 1, 'c'], ['Gorduras', 2, 'f']].map(function (x) { return '<div><i style="background:' + COL[x[2]] + '"></i>' + x[0] + '<b>' + fmt(cal[x[1]] / tot * 100) + '%</b></div>'; }).join('') + '</div></div></section>';
  // peso
  h += weightCard();
  // água semana
  h += '<section class="card"><div class="muted">💧 Água por dia (copos)</div><div class="bars water">' + rows.map(function (r) {
    return '<div class="bcol' + (r.k === tk ? ' today' : '') + '"><small>' + r.cups + '</small><div class="btrack"><i style="height:' + (r.cups / S.water.length * 100) + '%"></i></div><span>' + WD[kdate(r.k).getDay()] + '</span></div>';
  }).join('') + '</div><p class="muted small">Meta: ' + S.water.length + ' copos (' + fmt(S.water.length * S.settings.cup / 1000, 2) + ' litros)</p></section>';
  var full = rows.filter(function (r) { return r.md === mealsFor(r.k).length; }).length;
  h += '<section class="card streak"><div class="big-emoji">🏅</div><div><b>' + full + ' de 7 dias</b> com todas as refeições feitas<div class="muted small">Constância vale mais que perfeição.</div></div></section>';

}
function donut(parts, colors, inner) {
  var size = 150, sw = 22, r = (size - sw) / 2, c = 2 * Math.PI * r, off = 0, s = '';
  parts.forEach(function (p, i) { var len = c * p; s += '<circle cx="75" cy="75" r="' + r + '" fill="none" stroke="' + colors[i] + '" stroke-width="' + sw + '" stroke-dasharray="' + Math.max(0, len - 3) + ' ' + c + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 75 75)"/>'; off += len; });
  return '<div class="ring" style="width:150px;height:150px"><svg viewBox="0 0 150 150">' + s + '</svg><div class="rin">' + inner + '</div></div>';
}
function weightCard() {
  var s = S.settings, w = S.weights.slice().sort(function (a, b) { return a.d < b.d ? -1 : 1; }), goal = +s.goalWeight || null;
  var h = '<section class="card"><div class="row between"><div class="muted">⚖️ Peso</div>' + (w.length ? '<div class="muted small">' + w.length + ' registros</div>' : '') + '</div>';
  if (w.length) {
    var last = w[w.length - 1], first = w[0], diff = last.kg - first.kg;
    h += '<div class="hnum dark"><b>' + fmt(last.kg, 1) + '</b><span>kg</span></div><div class="wstats"><span class="' + (diff <= 0 ? 'good' : '') + '">' + (diff <= 0 ? '▼ ' : '▲ ') + fmt(Math.abs(diff), 1) + ' kg desde o início</span>' + (goal ? '<span>Faltam ' + fmt(Math.max(0, last.kg - goal), 1) + ' kg para a meta</span>' : '') + '</div>';
    if (w.length > 1) h += wchart(w, goal);

    if (days >= 7) { var pct = (first.kg - last.kg) / first.kg * 100 / (days / 7); h += '<p class="note">' + (pct > 1 ? '⚠️ Está perdendo mais de 1% do peso por semana. É rápido demais; vale conversar com um profissional.' : pct >= 0.5 ? '✅ Ritmo saudável: perda de ' + fmt(pct, 1) + '% do peso por semana.' : 'A balança varia de um dia para o outro. Olhe a tendência das semanas.') + '</p>'; }
  } else h += '<p class="muted">Ainda não há peso registrado. Pese-se de manhã, em jejum, uma vez por semana.</p>';
  h += '<div class="wform"><input id="wkg" type="number" step="0.1" inputmode="decimal" placeholder="Peso de hoje (kg)"><button class="btn primary" data-act="addW">Salvar peso</button></div>';
  h += '<button class="more" data-act="toggleMore" data-v="wmore">' + (ui.more.wmore ? 'Esconder ▲' : 'Meta e histórico ▼') + '</button>';
  if (ui.more.wmore) h += '<label class="msel">Peso que quer alcançar (kg)<input type="number" step="0.1" inputmode="decimal" data-chg="set" data-k="goalWeight" value="' + (s.goalWeight || '') + '"></label><ul class="wlist">' + w.slice().reverse().map(function (e) { return '<li><span>' + shortDate(e.d) + '</span><b>' + fmt(e.kg, 1) + ' kg</b><button class="iconbtn sm" data-act="rmW" data-d="' + e.d + '" aria-label="Apagar">' + ico('trash', 16) + '</button></li>'; }).join('') + '</ul>';
  return h + '</section>';
}
function wchart(w, goal) {
  var W = 320, H = 130, px = 12, py = 16, vals = w.map(function (e) { return e.kg; }); if (goal) vals.push(goal);
  var mn = Math.min.apply(null, vals) - 0.5, mx = Math.max.apply(null, vals) + 0.5;
  function X(i) { return px + i * (W - 2 * px) / Math.max(1, w.length - 1); }
  function Y(v) { return H - py - (v - mn) / (mx - mn) * (H - 2 * py); }
  var pts = w.map(function (e, i) { return X(i) + ',' + Y(e.kg); }).join(' ');
  var area = 'M' + X(0) + ',' + (H - py) + ' L' + pts.split(' ').join(' L') + ' L' + X(w.length - 1) + ',' + (H - py) + ' Z';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="wchart"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9BD25B" stop-opacity=".45"/><stop offset="1" stop-color="#9BD25B" stop-opacity="0"/></linearGradient></defs>' +
    (goal ? '<line x1="' + px + '" x2="' + (W - px) + '" y1="' + Y(goal) + '" y2="' + Y(goal) + '" stroke="#E7A53C" stroke-dasharray="5 4"/><text x="' + (W - px) + '" y="' + (Y(goal) - 4) + '" text-anchor="end" fill="#B57A1E" font-size="10">meta ' + fmt(goal, 1) + ' kg</text>' : '') +
    '<path d="' + area + '" fill="url(#wg)"/><polyline points="' + pts + '" fill="none" stroke="#2F7A4A" stroke-width="2.5" stroke-linejoin="round"/>' + w.map(function (e, i) { return '<circle cx="' + X(i) + '" cy="' + Y(e.kg) + '" r="4" fill="#fff" stroke="#2F7A4A" stroke-width="2"/>'; }).join('') + '</svg>';
}

  h += '<section class="card waterhero">' + ring(cups / total, 170, 16, COL.water, '<b>' + fmt(cups * S.settings.cup / 1000, 2) + ' L</b><small>de ' + fmt(total * S.settings.cup / 1000, 2) + ' L</small>') +
    '<button class="btn primary big full" data-act="drink">💧 Bebi um copo agora</button><div class="muted small center">Cada copo = ' + S.settings.cup + ' ml (um copo comum cheio)</div></section>';

  var gopts = [[rec, 'Recomendado · ' + fmt(rec / 1000, 2) + ' L']].concat([1500, 2000, 2500, 3000].filter(function (v) { return v !== rec; }).map(function (v) { return [v, fmt(v / 1000, 1) + ' L']; }));
  h += '<section class="card"><h3>Quanto beber por dia</h3><div class="wrec"><span>Recomendado para você</span><b>' + fmt(rec / 1000, 2) + ' litros por dia</b><small>' + (kg ? '35 ml para cada quilo do seu peso (' + fmt(kg, 1) + ' kg)' + (kg * 35 > 3000 ? ', com teto de 3 litros' : '') + '.' : 'Valor geral para mulher adulta. Anote seu peso em Progresso e o cálculo passa a ser pelo seu peso (35 ml por quilo).') + ' Em dias quentes ou com exercício, beba um pouco mais.</small></div>' +
    '<div class="ql left">Escolha a meta</div><div class="quick left">' + gopts.map(function (o) { var on = !lit && Math.round(o[0] / cup) === S.water.length; if (on) lit = true; return '<button class="chip' + (on ? ' on' : '') + '" data-act="wGoal" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>' +

    '<p class="muted small">Meta atual: <b>' + fmt(goal / 1000, 2) + ' L</b>, ' + S.water.length + ' copos de ' + cup + ' ml. Ao escolher, os horários são espalhados entre 7h e 21h. Para mudar um horário, vá em ' + (MODE === 'mobile' ? 'Mais' : 'Ajustes') + ' › Metas avançadas.</p></section>';
  h += '<div class="sechead"><h3>Horários</h3><span class="muted small">Toque no copo para marcar ou desmarcar</span></div><div class="cups">' + slots.map(function (s) {

    return '<button class="cup' + (done ? ' on' : '') + (late ? ' late' : '') + '" data-act="wtog" data-id="' + s.id + '"><span>' + (done ? '✓' : '💧') + '</span><b>' + s.t + '</b><small>' + (done ? 'bebido' : late ? 'atrasado' : 'a beber') + '</small></button>';
  }).join('') + '</div>';
  h += '<section class="card"><div class="row between"><div><b>🔔 Lembretes</b><div class="muted small">Aviso no celular na hora de beber água e de comer.</div></div><button class="toggle' + (S.settings.notif ? ' on' : '') + '" data-act="notif" aria-label="Ligar lembretes"><i></i></button></div><p class="muted small">' + remindText() + '</p></section>';
  return h;

function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim(); }
function findFoods(q) { q = norm(q); var a = foods().filter(function (f) { return !q || norm(f.n).indexOf(q) >= 0; }); if (q) a.sort(function (x, y) { return (norm(y.n).indexOf(q) === 0 ? 1 : 0) - (norm(x.n).indexOf(q) === 0 ? 1 : 0); }); return a; }

  var cats = {}; list.forEach(function (f) { (cats[f.cat] = cats[f.cat] || []).push(f); });

    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(function (r) { r.showNotification(title, {body:body, icon:'icons/icon-192.png', badge:'icons/icon-192.png'}); });
    else new Notification(title, {body:body});
  } catch (e) {}
}
setInterval(checkReminders, 30000);

// ---------- código da dieta (Netlify) ----------
var API = '/api/dieta', pushT = null, sync = {st:'', at:0};
function online() { return location.protocol.indexOf('http') === 0; }
function genCode() { var al = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', b = new Uint8Array(12), c = ''; crypto.getRandomValues(b); for (var i = 0; i < 12; i++) { c += al[b[i] % al.length]; if (i === 3 || i === 7) c += '-'; } return c; }
function syncText() { if (!sync.st) return 'Salvo automaticamente a cada alteração.'; var t = new Date(sync.at); var hm = pad(t.getHours()) + ':' + pad(t.getMinutes()); return sync.st === 'ok' ? '✓ Salvo na internet às ' + hm : sync.st === 'env' ? 'Salvando…' : '⚠️ Sem internet às ' + hm + '. Está salvo no aparelho e envio quando voltar.'; }
function updSync() { var el = $('#syncst'); if (el) el.textContent = syncText(); }
function schedulePush() { if (!S.code) return; clearTimeout(pushT); pushT = setTimeout(push, 1500); }
function push(loud) {
  if (!S.code || !online()) return;
  sync = {st:'env', at:Date.now()}; updSync();
  pull(S.code).then(function (rem) { if (rem) applyMerge(rem); return fetch(API + '?codigo=' + S.code, {method:'PUT', headers:{'content-type':'application/json'}, body:JSON.stringify(S)}); }).then(function (r) { if (!r.ok) throw 0; sync = {st:'ok', at:Date.now()}; updSync(); if (loud) { toast('☁️ Salvo na internet'); render(); } })
    .catch(function () { sync = {st:'err', at:Date.now()}; updSync(); if (loud) { toast('⚠️ Sem internet agora. Fica salvo no aparelho.'); render(); } });
}
// v6: junção segura entre aparelhos. Em vez de a versão mais nova apagar a outra inteira,
// cada dia de marcações fica com a versão alterada por último, e pesos, opções e alimentos próprios são somados.
function stableStr(o) { if (o === null || typeof o !== 'object') return JSON.stringify(o); if (Array.isArray(o)) return '[' + o.map(stableStr).join(',') + ']'; return '{' + Object.keys(o).sort().map(function (k) { return JSON.stringify(k) + ':' + stableStr(o[k]); }).join(',') + '}'; }
function mergeState(a, b) {
  var newer = (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a, older = newer === a ? b : a, m = JSON.parse(JSON.stringify(newer));
  var gone = {}; [older.gone || {}, newer.gone || {}].forEach(function (g) { Object.keys(g).forEach(function (k) { gone[k] = Math.max(gone[k] || 0, g[k]); }); }); m.gone = gone;
  m.logs = {}; [older.logs || {}, newer.logs || {}].forEach(function (L, isNew) { Object.keys(L).forEach(function (k) { var cur = m.logs[k]; if (!cur || (L[k].u || 0) > (cur.u || 0) || (isNew && (L[k].u || 0) === (cur.u || 0))) m.logs[k] = JSON.parse(JSON.stringify(L[k])); }); });
  function byKey(listOld, listNew, key, pre) { var o = {}, order = []; (listOld || []).concat(listNew || []).forEach(function (x) { var k = x[key]; if (!(k in o)) order.push(k); o[k] = x; }); return order.filter(function (k) { return !gone[pre + k]; }).map(function (k) { return JSON.parse(JSON.stringify(o[k])); }); }
  m.weights = byKey(older.weights, newer.weights, 'd', 'w:');
  m.myopts = byKey(older.myopts, newer.myopts, 'id', 'o:');
  m.custom = byKey(older.custom, newer.custom, 'id', 'c:');
  m.code = a.code || b.code; m.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return m;
}
function applyMerge(rem) {
  var m = mergeState(S, rem); m.code = S.code;
  if (stableStr(m) === stableStr(S)) return false;
  S = m; saveLocal(); if (!ui.lf && !ui.sheet) render(); return true;
}
function markLog(k) { var l = ensureLog(k); l.u = Date.now(); return l; }
function pull(code) { return fetch(API + '?codigo=' + encodeURIComponent(code), {cache:'no-store'}).then(function (r) { if (r.status === 404) return null; if (!r.ok) throw 0; return r.json(); }); }
function syncOnOpen() {
  if (!S.code || !online()) return;
  pull(S.code).then(function (rem) {
    if (!rem) { push(); return; }
    var changed = applyMerge(rem); sync = {st:'ok', at:Date.now()}; updSync();
    if (changed) toast('☁️ Dieta atualizada com o que foi salvo em outro aparelho'), render();
    if (stableStr(rem) !== stableStr(S)) push();
  }).catch(function () { sync = {st:'err', at:Date.now()}; updSync(); });
}
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') syncOnOpen(); });
function start() {
  app = $('#app'); ui.meal = null; render(); checkReminders(); syncOnOpen(); if (pushActive()) setTimeout(sendPlan, 3000);
  if ('serviceWorker' in navigator && online()) navigator.serviceWorker.register('sw.js').catch(function () {});
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
